</style><body><main><section class="card"><div class="meta"><span>FIG 03 · SERVER MODELS</span><span>自动循环 · 教学示意</span></div><div class="stage"><svg viewBox="0 0 800 500" role="img" aria-label="Nginx、Apache prefork、Apache event MPM 和 Caddy 工作机制比较"><defs><filter id="halo"><feGaussianBlur stdDeviation="8"/></filter></defs><ellipse cx="400" cy="432" rx="340" ry="25" fill="#000" opacity=".42" filter="url(#halo)"/><g id="rigs"></g></svg></div><div class="readout" data-readout><span id="phase">空闲连接：资源模型不同</span><b id="stats">比较的是机制，不是固定性能排名</b></div></section><div class="keys"><span><i class="i"></i>等待 / Keep-Alive</span><span><i class="r"></i>就绪</span><span><i class="x"></i>短步骤执行</span></div><p class="note">Nginx 与 Caddy 的表现取决于工作负载、TLS、协议、代理行为、配置和测试环境；本图不提供性能数据或绝对排名。</p></main><script>
(()=>{const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),root=$('rigs'),phase=$('phase'),stats=$('stats'),S={visible:true,frame:0,last:0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches},defs=[['Apache','prefork','一进程 · 一连接'],['Apache','event MPM','事件 + 工作线程'],['Nginx','event worker','epoll + 非阻塞 I/O'],['Caddy','自动 HTTPS','简洁配置 / 自动证书']],dots=[];function el(n,a,t){let e=document.createElementNS(NS,n);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));if(t)e.textContent=t;return e}defs.forEach((d,k)=>{let x=22+k*194,g=el('g',{});g.append(el('rect',{class:'rig',x,y:105,width:172,height:286,rx:8}),el('rect',{class:'plate',x:x+13,y:142,width:146,height:48,rx:4}),el('text',{class:'lab',x:x+22,y:124},d[0]),el('text',{class:'small',x:x+22,y:136},d[1]),el('text',{class:'small',x:x+22,y:377},d[2]));for(let j=0;j<16;j++){let cx=x+28+(j%4)*31,cy=218+Math.floor(j/4)*31,c=el('circle',{class:'dot idle',cx,cy,r:8});g.append(c);dots.push({c,k,j})}if(k===0){for(let j=0;j<4;j++)g.append(el('rect',{class:'plate',x:x+19+j*36,y:153,width:25,height:25,rx:2}))}if(k===1){g.append(el('path',{class:'line',d:`M${x+22} 166h125M${x+22} 174h82`}));for(let j=0;j<3;j++)g.append(el('rect',{class:'plate',x:x+21+j*42,y:315,width:31,height:18,rx:2}))}if(k===2){g.append(el('circle',{class:'plate',cx:x+86,cy:166,r:17}),el('path',{class:'line',d:`M${x+69} 166h34M${x+86} 149v34`}));}if(k===3){g.append(el('path',{class:'line',d:`M${x+25} 159h120M${x+25} 173h93`}));g.append(el('path',{class:'flow',id:'tls',d:`M${x+25} 199h120`,opacity:0}))}root.append(g)});function state(t){let q=Math.floor(t/1800)%4,ready=[],run=[];dots.forEach(o=>o.c.setAttribute('class','dot idle'));if(q===0){ready=[2,18,34,50];phase.textContent='空闲 / Keep-Alive：连接存在，不等于正在执行';stats.textContent='prefork 连接占用进程槽位；事件模型可等待就绪'}if(q===1){ready=[1,5,17,21,33,37,49,53];run=[17,49];phase.textContent='突发就绪：只有少量连接进入短处理步骤';stats.textContent='event MPM 管理 Keep-Alive；Nginx Worker 从就绪集推进'}if(q===2){ready=[6,2
