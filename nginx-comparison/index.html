<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101510"><title>Nginx 因果对照实验</title><style>:root{color-scheme:dark;--b:#1b241d;--f:#28342b;--m:#aab6ad;--idle:#405047;--wait:#dfc778;--run:#c0fa91;--blue:#8bb9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b3a2d,#101510 66%);color:#dce5dd;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}main{width:min(900px,100%);margin:auto;padding:clamp(14px,4vw,32px) clamp(12px,4vw,28px) 32px}.card{overflow:hidden;border:1px solid #748376;background:linear-gradient(145deg,#1a231c,#0c100d);box-shadow:0 24px 72px #0009}.meta,.read{display:flex;justify-content:space-between;gap:10px;padding:14px 16px 0;color:var(--m);font-size:11px;letter-spacing:.08em}.stage{aspect-ratio:800/510;min-height:290px}svg{display:block;width:100%;height:100%}.box{fill:var(--b);stroke:#bdc9c0;stroke-width:1.1}.face{fill:var(--f);stroke:#718075;stroke-width:.85}.line{fill:none;stroke:#738176;stroke-width:1;stroke-linecap:round}.lab{fill:#c7d1c9;font-size:11px;letter-spacing:1px}.small{fill:#91a095;font-size:9px;letter-spacing:.5px}.dot{stroke:#0d110e;stroke-width:.5}.idle{fill:var(--idle)}.wait{fill:var(--wait)}.run{fill:var(--run);filter:drop-shadow(0 0 4px #c0fa91)}.flow{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:5 5}.read{padding:0 16px 14px;letter-spacing:.02em}.read b{color:var(--run);text-align:right;font-weight:600}.note{margin:13px 3px 0;color:var(--m);font-size:12px}.keys{display:flex;gap:13px;flex-wrap:wrap;margin:12px 3px;color:var(--m);font-size:11px}.keys i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.keys .i{background:var(--idle)}.keys .w{background:var(--wait)}.keys .r{background:var(--run)}@media(max-width:420px){.meta,.read{padding-left:12px;padding-right:12px;font-size:9px}.read{flex-wrap:wrap}.read b{text-align:left}.stage{min-height:250px}.note{font-size:11px}}</style><body><main><section class="card"><div class="meta"><span>FIG 03 · SAME 100 CONNECTIONS</span><span>自动因果对照</span></div><div class="stage"><svg viewBox="0 0 800 510" role="img" aria-label="100 条慢连接下 Nginx、Apache prefork、Apache event MPM 与 Caddy 的教学对照"><defs><filter id="halo"><feGaussianBlur stdDeviation="8"/></filter><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#8bb9ff"/></marker></defs><ellipse cx="398" cy="452" rx="346" ry="24" fill="#000" opacity=".42" filter="url(#halo)"/><g id="art"></g></svg></div><div class="read" data-readout><span id="phase">条件相同：100 条连接，多数正在等待 I/O</span><b id="claim">连接存在 ≠ 正在执行</b></div></section><div class="keys"><span><i class="i"></i>已连接 / 保存状态</span><span><i class="w"></i>等待 I/O</span><span><i class="r"></i>本轮短步骤执行</span></div><p class="note">教学示意，不比较固定 CPU、延迟或吞吐。实际结果取决于工作负载、协议、TLS、配置、代理行为与测试环境。</p></main><script>
(()=>{const N='http://www.w3.org/2000/svg',A=document.getElementById('art'),$=x=>document.getElementById(x),S={v:true,f:0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};let dots=[],proc=[],worker=[],paths=[];const E=(n,a,t)=>{let e=document.createElementNS(N,n);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);if(t)e.textContent=t;return e},add=e=>A.append(e);add(E('rect',{class:'box',x:24,y:118,width:177,height:294,rx:9}));add(E('text',{class:'lab',x:42,y:143},'共同条件'));add(E('text',{class:'small',x:42,y:157},'100 条已建立慢连接'));add(E('rect',{class:'face',x:41,y:173,width:143,height:190,rx:5}));for(let i=0;i<100;i++){let c=E('circle',{class:'dot idle',cx:53+i%10*13.2,cy:188+Math.floor(i/10)*16.5,r:4.7});dots.push(c);add(c)}add(E('text',{class:'small',x:42,y:389},'绝大多数：等待客户端 / 上游 / 可写'));function panel(x,y,w,h,title,sub){add(E('rect',{class:'box',x,y,width:w,height:h,rx:8}));add(E('text',{class:'lab',x:x+16,y:y+23},title));add(E('text',{class:'small',x:x+16,y:y+37},sub))}panel(232,78,258,151,'Apache prefork','每个忙连接占用一个子进程');panel(232,252,258,160,'Nginx event worker','epoll + 非阻塞 I/O');panel(516,78,260,151,'Apache event MPM','事件管理 Keep-Alive + 工作线程');panel(516,252,260,160,'Caddy','自动 HTTPS / 简洁部署');for(let i=0;i<10;i++){let r=E('rect',{class:'face',x:250+(i%5)*43,y:132+Math.floor(i/5)*36,width:31,height:22,rx:3});proc.push(r);add(r)}add(E('text',{class:'small',x:250,y:208},'示意：100 等待连接 → 100 进程槽位'));add(E('circle',{class:'face',cx:292,cy:328,r:28}));add(E('path',{class:'line',d:'M264 328h56M292 300v56'}));for(let i=0;i<4;i++){let c=E('circle',{class:'dot idle',cx:350+i*24,cy:328,r:8});worker.push(c);add(c)}add(E('text',{class:'small',x:250,y:382},'1 Worker 保留状态；只取本轮就绪事件'));add(E('rect',{class:'face',x:535,y:130,width:54,height:22,rx:3}));add(E('rect',{class:'face',x:601,y:130,width:54,height:22,rx:3}));add(E('rect',{class:'face',x:667,y:130,width:54,height:22,rx:3}));add(E('path',{class:'line',d:'M544 177h190M544 189h130'}));add(E('text',{class:'small',x:535,y:208},'不是 prefork：事件机制也可复用线程'));add(E('rect',{class:'face',x:535,y:303,width:220,height:48,rx:5}));add(E('path',{class:'line',d:'M552 319h180M552 335h128'}));add(E('path',{class:'flow',id:'tls',d:'M535 368h190',opacity:0,marker-end:'url(#a)'}));add(E('text',{class:'small',x:535,y:388},'选择：自动证书 / 低维护 vs 精细流量治理'));['M201 205h31','M201 328h31','M490 153h26','M490 328h26'].forEach(d=>{let p=E('path',{class:'flow',d,opacity:0,marker-end:'url(#a)'});paths.push(p);add(p)});function set(es,c){es.forEach(e=>e.setAttribute('class',c))}function draw(t){let q=Math.floor(t/2600)%4;set(dots,'dot idle');set(proc,'face');set(worker,'dot idle');paths.forEach(p=>p.setAttribute('opacity',0));$('tls').setAttribute('opacity',0);if(q===0){set(dots.slice(0,92),'dot wait');set(proc,'face wait');$('phase').textContent='同样 100 条慢连接：多数只是等待 I/O';$('claim').textContent='prefork：等待连接仍占用子进程槽位'}if(q===1){set(dots.slice(3,7),'dot run');set(proc,'face wait');paths[0].setAttribute('opacity',1);paths[1].setAttribute('opacity',1);$('phase').textContent='只有 4 条连接就绪；其它 96 条仍在等待';$('claim').textContent='Nginx：Worker 取 4 个事件，未为 100 条连接持续执行'}if(q===2){set(dots.slice(10,14),'dot run');set(worker,'dot run');paths[2].setAttribute('opacity',1);$('phase').textContent='事件模型不是 Nginx 独有：Apache event MPM 也管理 Keep-Alive';$('claim').textContent='不能断言 Nginx 必然更快；看模块、负载与配置'}if(q===3){set(dots.slice(20,24),'dot run');$('tls').setAttribute('opacity',1);paths[3].setAttribute('opacity',1);$('phase').textContent='生产选择：代理治理与自动化 HTTPS 是不同优先级';$('claim').textContent='Nginx 偏细粒度与成熟生态；Caddy 偏快速部署与低维护'}}function tick(t){draw(S.reduced?5200:t);if(S.v&&!S.reduced)S.f=requestAnimationFrame(tick);else S.f=0}function run(){if(!S.f&&S.v)S.f=requestAnimationFrame(tick)}new IntersectionObserver(e=>{S.v=e[e.length-1].isIntersecting;run()},{rootMargin:'120px 0px'}).observe(document.querySelector('.stage'));draw(0);run()})();
</script></body></html>
