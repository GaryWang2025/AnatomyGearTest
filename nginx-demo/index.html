<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111512"><title>Nginx · 100 连接事件循环</title><style>
:root{color-scheme:dark;--p:#111512;--panel:#181e19;--edge:#627066;--muted:#9ca89e;--ink:#d9e2db;--wait:#3b4940;--ready:#e4d48d;--run:#b8f58a;--proxy:#8db7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#253128,#111512 62%);color:var(--ink);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}main{width:min(820px,100%);margin:auto;padding:clamp(14px,4vw,32px) clamp(12px,4vw,28px) 32px}.card{overflow:hidden;border:1px solid var(--edge);background:linear-gradient(145deg,#1b221d,#0d100e);box-shadow:0 24px 70px #0009}.meta,.readout{display:flex;justify-content:space-between;gap:12px;padding:14px 16px 0;color:var(--muted);font-size:11px;letter-spacing:.1em}.stage{aspect-ratio:760/500;min-height:300px;position:relative}svg{display:block;width:100%;height:100%}.machine{fill:#2d3930;stroke:#bdc9c0;stroke-width:1.2}.face{fill:#1b231d;stroke:#839087;stroke-width:1}.thin{fill:none;stroke:#7e8b81;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}.faint{fill:none;stroke:#47554b;stroke-width:.8}.label{fill:#aab6ad;font-size:11px;letter-spacing:1.2px}.small{fill:#728077;font-size:9px;letter-spacing:.7px}.connection{stroke:#0d100e;stroke-width:.8}.waiting{fill:var(--wait)}.ready{fill:var(--ready)}.active{fill:var(--run);filter:drop-shadow(0 0 3px #b8f58a)}.pulse{fill:none;stroke:var(--run);stroke-width:2;opacity:.8}.proxy{stroke:var(--proxy);stroke-width:2;fill:none;stroke-dasharray:5 6}.readout{padding:0 16px 14px;letter-spacing:.02em;align-items:flex-start}.readout b{color:var(--run);text-align:right;font-weight:600;min-width:0}.caption{margin:13px 3px 0;color:var(--muted);font-size:12px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 3px 0;color:var(--muted);font-size:11px}.key{display:inline-flex;align-items:center;gap:5px}.key i{width:8px;height:8px;border-radius:50%;display:inline-block}.key .w{background:var(--wait)}.key .r{background:var(--ready)}.key .a{background:var(--run)}@media(max-width:420px){.meta,.readout{padding-left:12px;padding-right:12px;font-size:9px}.readout{flex-wrap:wrap}.readout b{text-align:left}.stage{min-height:250px}.caption{font-size:11px}}
</style></head><body><main><section class="card"><div class="meta"><span>FIG 02 · NGINX</span><span>100 连接 · 自动循环</span></div><div class="stage"><svg viewBox="0 0 760 500" role="img" aria-label="Nginx 事件驱动模型：100 条连接、epoll、Worker 和上游服务器"><defs><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#8db7ff"/></marker></defs><ellipse cx="388" cy="406" rx="230" ry="28" fill="#000" opacity=".45" filter="url(#glow)"/>
<g><rect class="machine" x="286" y="32" width="188" height="54" rx="6"/><circle class="waiting" cx="310" cy="59" r="7"/><path class="thin" d="M328 50h118m-118 10h86m-86 10h104"/><text class="label" x="350" y="109">MASTER · 配置 / RELOAD</text><path class="thin" d="M380 86v28"/></g>
<g><rect class="machine" x="270" y="120" width="220" height="54" rx="7"/><path class="thin" d="M292 147h44m12 0h42m12 0h66"/><circle id="epoll-lamp" class="ready" cx="463" cy="147" r="7"/><text class="label" x="322" y="194">EPOLL_WAIT · 就绪队列</text></g>
<g><rect class="machine" x="270" y="228" width="220" height="120" rx="9"/><rect class="face" x="289" y="247" width="182" height="48" rx="4"/><path class="thin" d="M305 267h78m-78 11h50m94-12 10 0m-10 11 10 0"/><circle id="worker-lamp" class="waiting" cx="445" cy="318" r="11"/><path class="faint" d="M294 321h118m-118 12h86"/><text class="label" x="330" y="371">WORKER · 短步骤处理</text></g>
<g><rect class="machine" x="555" y="214" width="155" height="150" rx="8"/><path class="face" d="M575 239h115v28H575zm0 38h115v28H575zm0 38h115v28H575z"/><circle class="proxy" cx="586" cy="253" r="4"/><circle class="proxy" cx="586" cy="291" r="4"/><circle class="proxy" cx="586" cy="329" r="4"/><text class="label" x="581" y="390">UPSTREAMS</text></g>
<g><rect class="machine" x="30" y="192" width="190" height="238" rx="9"/><path class="faint" d="M48 216h154m-154 198h154"/><text class="label" x="64" y="458">100 CLIENT CONNECTIONS</text><g id="connections"></g></g>
<path class="thin" d="M220 288h50m220 0h65"/><path id="proxy-path" class="proxy" marker-end="url(#arrow)" d="M490 288h65" opacity="0"/><circle id="event-pulse" class="pulse" cx="245" cy="288" r="5" opacity="0"/><text class="small" x="229" y="275">READY</text><text class="small" x="495" y="275">NON-BLOCKING PROXY</text></svg></div><div class="readout" data-readout><span id="phase">100 已连接 · 大多等待 I/O</span><b id="stats">就绪 4 · 执行 0 · 上游 0</b></div></section><div class="legend"><span class="key"><i class="w"></i>等待 I/O</span><span class="key"><i class="r"></i>epoll 已就绪</span><span class="key"><i class="a"></i>Worker 正在推进</span></div><p class="caption">教学模型：Worker 管理 100 条连接，但每轮只推进少量就绪事件；遇到等待时保存状态并返回事件循环。</p></main><script>
(()=>{const S={n:100,visible:true,last:0,frame:0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};const g=document.getElementById('connections'),phase=document.getElementById('phase'),stats=document.getElementById('stats'),ep=document.getElementById('epoll-lamp'),wl=document.getElementById('worker-lamp'),pp=document.getElementById('proxy-path'),pulse=document.getElementById('event-pulse');const dots=[];for(let i=0;i<100;i++){let c=document.createElementNS('http://www.w3.org/2000/svg','circle'),x=51+(i%10)*16,y=235+Math.floor(i/10)*16;c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',5);c.setAttribute('class','connection waiting');g.append(c);dots.push(c)}const set=(list,cls)=>list.forEach(i=>dots[i].setAttribute('class','connection '+cls));function draw(t){let q=Math.floor(t/1000)%12,ready=[],active=[],prox=0;if(q<3){ready=[4,18,37,72]}else if(q<6){ready=[2,11,24,31,46,58,63,70,81,88];active=[11,58]}else if(q<9){ready=[7,19,33,49,61];active=[33];prox=1}else{ready=[6,15,27,44,69,84];active=[84];prox=1}dots.forEach(d=>d.setAttribute('class','connection waiting'));set(ready,'ready');set(active,'active');ep.setAttribute('class',ready.length?'ready':'waiting');wl.setAttribute('class',active.length?'active':'waiting');pp.setAttribute('opacity',prox?'1':'0');pulse.setAttribute('opacity',ready.length?'1':'0');pulse.setAttribute('r',String(4+(t%700)/95));phase.textContent=q<3?'100 已连接 · 大多等待 I/O':q<6?'epoll 返回一小批就绪事件':q<9?'Worker 推进请求 · 等待上游响应':'响应可写 · 慢连接保留进度';stats.textContent=`就绪 ${ready.length} · 执行 ${active.length} · 上游 ${prox}`;}
function tick(now){const dt=Math.min(now-(S.last||now),33);S.last=now;draw(S.reduced?4000:now);if(S.visible&&!S.reduced)S.frame=requestAnimationFrame(tick);else S.frame=0}function run(){if(!S.frame&&S.visible)S.frame=requestAnimationFrame(tick)}new IntersectionObserver(e=>{S.visible=e[e.length-1].isIntersecting;run()},{rootMargin:'120px 0px'}).observe(document.querySelector('.stage'));draw(0);run()})();
</script></body></html>
